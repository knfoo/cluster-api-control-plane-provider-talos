apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            # The in-place update hooks of the Runtime SDK, served on --runtime-extension-port.
            # Port names are IANA service names of at most 15 characters
            # (k8s.io/apimachinery/pkg/util/validation.IsValidPortName).
            - containerPort: 9444
              name: runtime-ext
              protocol: TCP
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: $(SERVICE_NAME)-cert
