---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
spec:
  ports:
    - name: webhook-server
      port: 443
      targetPort: 9443
    # The in-place update hooks (CanUpdateMachine, CanUpdateMachineSet, UpdateMachine) are
    # served by the manager on --runtime-extension-port, default 9444.
    - name: runtime-extension
      port: 9444
      targetPort: runtime-extension
  selector:
    control-plane: controller-manager
