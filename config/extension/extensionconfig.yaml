# The in-place update hooks of the Runtime SDK, served by the CACPPT manager itself
# (main.go, pkg/inplaceupdate). There is no separate extension binary to run.
#
# This sample is not applied by the provider: an operator registers the extension by
# applying this file to the management cluster, and Cluster API calls its hooks only when
# the InPlaceUpdates feature gate is enabled, which is off by default. The hooks therefore
# ship dark, and the manager does not even listen on the runtime-extension port while the
# gate is off.
#
# The manager answers the Discovery, CanUpdateMachine, CanUpdateMachineSet and UpdateMachine
# hooks; Discovery is served by the Runtime SDK server itself from the handlers it registered.
# Cluster API discovers the handlers after registration and writes them into the status of this
# object.
#
# Cluster API only calls an extension over https (api/runtime/v1alpha1 ClientConfig: "The scheme
# must be https"), so the hooks are served with the certificate cert-manager issues for the
# manager's webhook service. The annotation below makes the Runtime SDK reconciler inject the
# CA of that certificate into clientConfig.caBundle.
apiVersion: runtime.cluster.x-k8s.io/v1alpha1
kind: ExtensionConfig
metadata:
  name: talos-in-place-update
  namespace: default
  annotations:
    runtime.cluster.x-k8s.io/inject-ca-from-secret: cacppt-system/cacppt-webhook-service-cert
spec:
  clientConfig:
    # The manager pod, reached through its webhook service. --runtime-extension-port defaults
    # to 9444 and is exposed by config/webhook/service.yaml as the runtime-extension port.
    url: https://cacppt-webhook-service.cacppt-system.svc:9444
  # Only call the hooks for objects in namespaces that carry this label, so the hooks
  # are scoped to the clusters that are meant to be updated in place.
  namespaceSelector:
    matchLabels:
      talos-in-place-update: enabled
